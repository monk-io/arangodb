version: 2.1
# Infrastructure pipeline: rebuild test and/or Ubuntu build Docker images.
#
# Triggered via:
#   pipeline-type=infrastructure          (explicit)
#   rebuild-test-docker-images=true       (legacy, maps to this pipeline)
#
# Relevant parameters (set in config.yml when triggering):
#   rebuild-test-docker-images=true       rebuild test runner + driver images
#   rebuild-build-docker-images=true      rebuild the Ubuntu compiler image
#   automated-commit=true                 commit updated tag files back to the repo
#
# Supersedes build_test_image.yml (kept for reference).

orbs:
  aws-cli: circleci/aws-cli@4.1.1
  aws-ecr: circleci/aws-ecr@9.0.1

parameters:
  rebuild-test-docker-images:
    type: boolean
    default: true
  rebuild-build-docker-images:
    type: boolean
    default: false
  automated-commit:
    type: boolean
    default: false

commands:
  checkout-arangodb:
    parameters:
      destination:
        type: string
    steps:
      - run:
          name: Checkout ArangoDB
          command: |
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            mkdir -p << parameters.destination >>
            cd << parameters.destination >>
            git init
            git remote add origin git@github.com:arangodb/arangodb.git
            git fetch --depth 1 origin << pipeline.git.revision >>
            git checkout << pipeline.git.revision >>

  checkout-rta:
    parameters:
      destination:
        type: string
    steps:
      - run:
          name: Checkout RTA
          command: |
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone git@github.com:arangodb/release-test-automation.git << parameters.destination >>


jobs:
  cancel-redundant-pipelines:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Cancel redundant pipelines
          command: |
            if [[ "$CIRCLE_BRANCH" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || [ "$CIRCLE_BRANCH" == "devel" ]; then
              echo "Branch is a release branch or devel, not cancelling any pipelines"
              exit 0
            fi
            CURRENT_PIPELINE_NUM=$(curl -s --header "Circle-Token: $CIRCLECI_TOKEN" \
              "https://circleci.com/api/v2/workflow/${CIRCLE_WORKFLOW_ID}" | jq -r '.pipeline_number')
            echo "Current pipeline: #${CURRENT_PIPELINE_NUM}"
            # Cancel older API-triggered pipelines on this branch (infrastructure + nightly),
            # leaving commit-triggered testing pipelines untouched.
            PIPE_IDS=$(curl -s --header "Circle-Token: $CIRCLECI_TOKEN" \
              "https://circleci.com/api/v2/project/gh/arangodb/arangodb/pipeline?branch=$CIRCLE_BRANCH" | \
              jq -r --argjson N "$CURRENT_PIPELINE_NUM" \
              '.items[]|select(.state == "created")|select(.number < $N)|select(.trigger.type == "api")|.id')
            if [ -z "$PIPE_IDS" ]; then echo "Nothing to cancel"; exit 0; fi
            for PIPE_ID in $PIPE_IDS; do
              curl -s --header "Circle-Token: $CIRCLECI_TOKEN" \
                "https://circleci.com/api/v2/pipeline/${PIPE_ID}/workflow" | \
                jq -r '.items[]|select(.status == "on_hold" or .status == "running")|.id' >> WF_to_cancel.txt
            done
            if [ -s WF_to_cancel.txt ]; then
              echo "Cancelling the following workflow(s):"
              cat WF_to_cancel.txt
              while read WF_ID; do
                curl -s --header "Circle-Token: $CIRCLECI_TOKEN" --request POST \
                  "https://circleci.com/api/v2/workflow/$WF_ID/cancel"
              done < WF_to_cancel.txt
            else
              echo "Nothing to cancel"
            fi

  # ── Test Docker images ──────────────────────────────────────────────────────
  # Builds the images used for running ArangoDB tests and driver tests.
  # Sources: scripts/docker/{test,go-test,js-test,...} + release-test-automation repo.
  build-test-docker-image:
    docker:
      - image: cimg/base:current
    parameters:
      arch:
        type: string
        default: ""
      image:
        type: string
        default: public.ecr.aws/b0b8h2r4/test-ubuntu
      resource-class:
        type: string
    resource_class: << parameters.resource-class >>
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          role_arn: "arn:aws:iam::242063586340:role/CircleCI-Container-Handler"
      - aws-ecr/ecr_login:
          public_registry: true
      - add_ssh_keys:
          fingerprints:
            - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
      - checkout-arangodb:
          destination: /home/circleci/project
      - checkout-rta:
          destination: /home/circleci/project-rta
      - run:
          name: Build base test Docker image
          command: |
            set -x
            cd /home/circleci/project/scripts/docker/test
            image=<< parameters.image >>
            cp ../../../VERSIONS .
            cp ../../../ARANGO-VERSION .
            cd ..
            /bin/sh build-image.sh $image << parameters.arch >> test
            /bin/sh determine-tag.sh $image << parameters.arch >> | tee << parameters.arch >>-tag.txt
            docker tag $image:latest-<< parameters.arch >> $image:$(cat << parameters.arch >>-tag.txt)-<< parameters.arch >>
            docker tag $image:latest-<< parameters.arch >> $image:latest
            docker push $image:$(cat << parameters.arch >>-tag.txt)-<< parameters.arch >>
      - run:
          name: Build RTA Docker image
          command: |
            set -x
            TAG="$(cat /home/circleci/project/scripts/docker/<< parameters.arch >>-tag.txt)"
            cd /home/circleci/project-rta
            ./jenkins/build_and_push_circle-ci-containers.sh "<< parameters.image >>" "${TAG}"
      - run:
          name: Build go-test Docker image
          command: |
            set -x
            cd /home/circleci/project/scripts/docker
            image=<< parameters.image >>-go
            /bin/sh build-image.sh $image << parameters.arch >> go-test
            /bin/sh determine-tag.sh $image << parameters.arch >> | tee << parameters.arch >>-tag-go.txt
            docker tag $image:latest-<< parameters.arch >> $image:$(cat << parameters.arch >>-tag-go.txt)-<< parameters.arch >>
            docker push $image:$(cat << parameters.arch >>-tag-go.txt)-<< parameters.arch >>
      - run:
          name: Build js-test Docker image
          command: |
            set -x
            cd /home/circleci/project/scripts/docker
            image=<< parameters.image >>-js
            /bin/sh build-image.sh $image << parameters.arch >> js-test
            /bin/sh determine-tag.sh $image << parameters.arch >> | tee << parameters.arch >>-tag-js.txt
            docker tag $image:latest-<< parameters.arch >> $image:$(cat << parameters.arch >>-tag-js.txt)-<< parameters.arch >>
            docker push $image:$(cat << parameters.arch >>-tag-js.txt)-<< parameters.arch >>
      - run:
          name: Build python-test Docker image
          command: |
            set -x
            cd /home/circleci/project/scripts/docker
            image=<< parameters.image >>-python
            /bin/sh build-image.sh $image << parameters.arch >> python-test
            /bin/sh determine-tag.sh $image << parameters.arch >> | tee << parameters.arch >>-tag-python.txt
            docker tag $image:latest-<< parameters.arch >> $image:$(cat << parameters.arch >>-tag-python.txt)-<< parameters.arch >>
            docker push $image:$(cat << parameters.arch >>-tag-python.txt)-<< parameters.arch >>
      - run:
          name: Build java-test Docker image
          command: |
            set -x
            cd /home/circleci/project/scripts/docker
            image=<< parameters.image >>-java
            /bin/sh build-image.sh $image << parameters.arch >> java-test
            /bin/sh determine-tag.sh $image << parameters.arch >> | tee << parameters.arch >>-tag-java.txt
            docker tag $image:latest-<< parameters.arch >> $image:$(cat << parameters.arch >>-tag-java.txt)-<< parameters.arch >>
            docker push $image:$(cat << parameters.arch >>-tag-java.txt)-<< parameters.arch >>
      - run:
          name: Build spark-test Docker image
          command: |
            set -x
            cd /home/circleci/project/scripts/docker
            image=<< parameters.image >>-spark
            /bin/sh build-image.sh $image << parameters.arch >> spark-test
            /bin/sh determine-tag.sh $image << parameters.arch >> | tee << parameters.arch >>-tag-spark.txt
            docker tag $image:latest-<< parameters.arch >> $image:$(cat << parameters.arch >>-tag-spark.txt)-<< parameters.arch >>
            docker push $image:$(cat << parameters.arch >>-tag-spark.txt)-<< parameters.arch >>
      - run:
          name: Build tinkerpop-test Docker image
          command: |
            set -x
            cd /home/circleci/project/scripts/docker
            image=<< parameters.image >>-tinkerpop
            /bin/sh build-image.sh $image << parameters.arch >> tinkerpop-test
            /bin/sh determine-tag.sh $image << parameters.arch >> | tee << parameters.arch >>-tag-tinkerpop.txt
            docker tag $image:latest-<< parameters.arch >> $image:$(cat << parameters.arch >>-tag-tinkerpop.txt)-<< parameters.arch >>
            docker push $image:$(cat << parameters.arch >>-tag-tinkerpop.txt)-<< parameters.arch >>
      - run:
          name: Build spring-test Docker image
          command: |
            set -x
            cd /home/circleci/project/scripts/docker
            image=<< parameters.image >>-spring
            /bin/sh build-image.sh $image << parameters.arch >> spring-test
            /bin/sh determine-tag.sh $image << parameters.arch >> | tee << parameters.arch >>-tag-spring.txt
            docker tag $image:latest-<< parameters.arch >> $image:$(cat << parameters.arch >>-tag-spring.txt)-<< parameters.arch >>
            docker push $image:$(cat << parameters.arch >>-tag-spring.txt)-<< parameters.arch >>
      - persist_to_workspace:
          root: .
          paths:
            - scripts/docker/*-tag*.txt

  build-test-docker-manifest:
    docker:
      - image: cimg/base:current
    parameters:
      image:
        type: string
        default: public.ecr.aws/b0b8h2r4/test-ubuntu
    steps:
      - add_ssh_keys:
          fingerprints:
            - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
      - checkout-arangodb:
          destination: /home/circleci/project
      - checkout-rta:
          destination: /home/circleci/project-rta
      - attach_workspace:
          at: .
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          role_arn: "arn:aws:iam::242063586340:role/CircleCI-Container-Handler"
      - aws-ecr/ecr_login:
          public_registry: true
      - run:
          name: Build test container manifest
          command: |
            cd scripts/docker/
            ./build-manifest.sh << parameters.image >> $(cat amd64-tag.txt)
      - run:
          name: Build RTA container manifest
          command: |
            TAG="$(cat /home/circleci/project/scripts/docker/amd64-tag.txt)"
            cd /home/circleci/project-rta
            ./jenkins/build_and_push_circle-ci-manifests.sh << parameters.image >> $TAG
      - run:
          name: Build go-test container manifest
          command: |
            cd scripts/docker/
            ./build-manifest.sh << parameters.image >>-go $(cat amd64-tag-go.txt)
      - run:
          name: Build js-test container manifest
          command: |
            cd scripts/docker/
            ./build-manifest.sh << parameters.image >>-js $(cat amd64-tag-js.txt)
      - run:
          name: Build python-test container manifest
          command: |
            cd scripts/docker/
            ./build-manifest.sh << parameters.image >>-python $(cat amd64-tag-python.txt)
      - run:
          name: Build java-test container manifest
          command: |
            cd scripts/docker
            ./build-manifest.sh << parameters.image >>-java $(cat amd64-tag-java.txt)
      - run:
          name: Build spark-test container manifest
          command: |
            cd scripts/docker
            ./build-manifest.sh << parameters.image >>-spark $(cat amd64-tag-spark.txt)
      - run:
          name: Build tinkerpop-test container manifest
          command: |
            cd scripts/docker
            ./build-manifest.sh << parameters.image >>-tinkerpop $(cat amd64-tag-tinkerpop.txt)
      - run:
          name: Build spring-test container manifest
          command: |
            cd scripts/docker
            ./build-manifest.sh << parameters.image >>-spring $(cat amd64-tag-spring.txt)
      - when:
          condition: << pipeline.parameters.automated-commit >>
          steps:
            - add_ssh_keys:
                fingerprints:
                  - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
            - run:
                name: Update test-docker-image defaults and commit
                command: |
                  ssh-keyscan github.com >> ~/.ssh/known_hosts
                  git config user.email "build-automation@arangodb.biz"
                  git config user.name "CircleCI Image Builder"
                  TAG="$(cat /home/circleci/project/scripts/docker/amd64-tag.txt)"
                  TEST_IMAGE="public.ecr.aws/b0b8h2r4/test-ubuntu"
                  sed -i "s|${TEST_IMAGE}:[^ \"]*|${TEST_IMAGE}:${TAG}|g" \
                    /home/circleci/project/.circleci/config.yml \
                    /home/circleci/project/.circleci/base_config.yml
                  cd /home/circleci/project
                  git add scripts/docker/amd64-tag.txt \
                          .circleci/config.yml \
                          .circleci/base_config.yml
                  if git diff --cached --quiet; then
                    echo "No changes to commit"
                    exit 0
                  fi
                  git commit -m "chore: update test docker image tag [skip ci]"
                  git push origin HEAD:$CIRCLE_BRANCH

  # ── Ubuntu build images ─────────────────────────────────────────────────────
  # Rebuilds the compiler image used by compile jobs.
  # Sources: scripts/docker/build/linux/Dockerfile.{x86-64,arm64}
  # Image:   public.ecr.aws/b0b8h2r4/arangodb/ubuntubuildarangodb-<MAJOR><MINOR>
  #          e.g. ubuntubuildarangodb-312 for ArangoDB 3.12.x
  # Tag:     <ubuntu-version>-<git-short-sha>  (via determine-tag.sh)
  build-ubuntu-build-image:
    docker:
      - image: cimg/base:current
    parameters:
      arch:
        type: string   # amd64 | arm64
      resource-class:
        type: string
    resource_class: << parameters.resource-class >>
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          role_arn: "arn:aws:iam::242063586340:role/CircleCI-Container-Handler"
      - aws-ecr/ecr_login:
          public_registry: true
      - add_ssh_keys:
          fingerprints:
            - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
      - checkout-arangodb:
          destination: /home/circleci/project
      - run:
          name: Build Ubuntu build Docker image
          command: |
            set -x
            source /home/circleci/project/scripts/oskar.bash
            find_arangodb_version /home/circleci/project/CMakeLists.txt
            IMAGE="public.ecr.aws/b0b8h2r4/arangodb/ubuntubuildarangodb-${ARANGODB_VERSION_MAJOR}${ARANGODB_VERSION_MINOR}"
            if [ "<< parameters.arch >>" = "amd64" ]; then TARGET="build-amd64"; else TARGET="build-arm64"; fi
            make -C /home/circleci/project/scripts/docker/build/linux \
              "${TARGET}" IMAGE="${IMAGE}"
      - run:
          name: Tag and push
          command: |
            set -x
            source /home/circleci/project/scripts/oskar.bash
            find_arangodb_version /home/circleci/project/CMakeLists.txt
            IMAGE="public.ecr.aws/b0b8h2r4/arangodb/ubuntubuildarangodb-${ARANGODB_VERSION_MAJOR}${ARANGODB_VERSION_MINOR}"
            if [ "<< parameters.arch >>" = "amd64" ]; then
              TARGET="push-amd64"
              ARCH_SUFFIX="amd64"
            else
              TARGET="push-arm64"
              ARCH_SUFFIX="arm64v8"
            fi
            make -C /home/circleci/project/scripts/docker/build/linux \
              "${TARGET}" IMAGE="${IMAGE}" ALLOW_ECR_PUSH=1
            TAG=$(cd /home/circleci/project/scripts/docker/build/linux && \
                  ./determine-tag.sh "${IMAGE}" "${ARCH_SUFFIX}")
            echo "${TAG}"   > /tmp/build-image-tag.txt
            echo "${IMAGE}" > /tmp/build-image-name.txt
      - persist_to_workspace:
          root: /tmp
          paths:
            - build-image-tag.txt
            - build-image-name.txt

  build-ubuntu-build-image-manifest:
    docker:
      - image: cimg/base:current
    steps:
      - add_ssh_keys:
          fingerprints:
            - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
      - checkout-arangodb:
          destination: /home/circleci/project
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: /tmp
      - aws-cli/setup:
          role_arn: "arn:aws:iam::242063586340:role/CircleCI-Container-Handler"
      - aws-ecr/ecr_login:
          public_registry: true
      - run:
          name: Create multi-arch build image manifest
          command: |
            set -x
            TAG="$(cat /tmp/build-image-tag.txt)"
            IMAGE="$(cat /tmp/build-image-name.txt)"
            make -C /home/circleci/project/scripts/docker/build/linux \
              manifest IMAGE="${IMAGE}" TAG="${TAG}" ALLOW_ECR_PUSH=1
      - when:
          condition: << pipeline.parameters.automated-commit >>
          steps:
            - add_ssh_keys:
                fingerprints:
                  - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
            - run:
                name: Update build-docker-image defaults and commit
                command: |
                  ssh-keyscan github.com >> ~/.ssh/known_hosts
                  git config user.email "build-automation@arangodb.biz"
                  git config user.name "CircleCI Image Builder"
                  TAG="$(cat /tmp/build-image-tag.txt)"
                  IMAGE="$(cat /tmp/build-image-name.txt)"
                  echo "${IMAGE}:${TAG}" > /home/circleci/project/scripts/docker/build/linux/amd64-build-tag.txt
                  sed -i "s|public\.ecr\.aws/b0b8h2r4/arangodb/ubuntubuildarangodb-[^\"]*|${IMAGE}:${TAG}|g" \
                    /home/circleci/project/.circleci/config.yml \
                    /home/circleci/project/.circleci/base_config.yml \
                    /home/circleci/project/.circleci/nightly_packages.yml
                  cd /home/circleci/project
                  git add scripts/docker/build/linux/amd64-build-tag.txt \
                          .circleci/config.yml \
                          .circleci/base_config.yml \
                          .circleci/nightly_packages.yml
                  if git diff --cached --quiet; then
                    echo "No changes to commit"
                    exit 0
                  fi
                  git commit -m "chore: update Ubuntu build image tag [skip ci]"
                  git push origin HEAD:$CIRCLE_BRANCH

workflows:
  # Rebuild test runner and driver Docker images (triggered by rebuild-test-docker-images=true)
  build-test-docker-images:
    when: << pipeline.parameters.rebuild-test-docker-images >>
    jobs:
      - cancel-redundant-pipelines:
          context: [ circleci-token ]

      - build-test-docker-image:
          resource-class: arm.large
          name: aarch64-test-docker-image
          arch: arm64
          requires: [cancel-redundant-pipelines]

      - build-test-docker-image:
          resource-class: large
          name: x64-test-docker-image
          arch: amd64
          requires: [cancel-redundant-pipelines]

      - build-test-docker-manifest:
          name: build-test-docker-image-manifest
          requires:
            - aarch64-test-docker-image
            - x64-test-docker-image

  # Rebuild the Ubuntu compiler image used by compile-linux jobs (rebuild-build-docker-images=true)
  build-ubuntu-build-images:
    when: << pipeline.parameters.rebuild-build-docker-images >>
    jobs:
      - cancel-redundant-pipelines:
          context: [ circleci-token ]

      - build-ubuntu-build-image:
          resource-class: arm.large
          name: aarch64-build-image
          arch: arm64
          requires: [cancel-redundant-pipelines]

      - build-ubuntu-build-image:
          resource-class: large
          name: x64-build-image
          arch: amd64
          requires: [cancel-redundant-pipelines]

      - build-ubuntu-build-image-manifest:
          name: build-ubuntu-build-image-manifest
          requires:
            - aarch64-build-image
            - x64-build-image
